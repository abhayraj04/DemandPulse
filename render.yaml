services:
  - type: web
    name: demandpulse
    env: python
    region: oregon
    plan: free
    buildCommand: bash build.sh
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: NODE_VERSION
        value: 20.11.0
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
